name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Push database schema
        run: npm run db:push
        env:
          DATABASE_URL: file:./test.db

      - name: Seed database
        run: npm run db:seed
        env:
          DATABASE_URL: file:./test.db

      - name: Start server
        run: npm run dev &
        env:
          PORT: 3001
          DATABASE_URL: file:./test.db

      - name: Wait for server
        run: sleep 5

      - name: Test health endpoint
        run: curl -f http://localhost:3001/ || exit 1

      - name: Test categories endpoint
        run: curl -f http://localhost:3001/api/categories || exit 1

      - name: Test products endpoint
        run: curl -f http://localhost:3001/api/products/featured || exit 1

      - name: Test login endpoint
        run: |
          curl -f -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@pambala.ao","password":"admin123"}' || exit 1

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build
        run: npm run build
